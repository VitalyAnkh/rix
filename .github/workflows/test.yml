name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # So CI builds hey against the same toolchain my systems do
      TOOLCHAIN: nixpkgs#janet nixpkgs#jpm nixpkgs#gcc nixpkgs#zsh nixpkgs#git
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            warn-dirty = false

      - name: Set up the hey environment
        run: |
          tree="$HOME/.local/share/janet/jpm_tree"
          # lib/hey expects these to already be set by the nixos env
          {
            echo "DOTFILES_HOME=$GITHUB_WORKSPACE"
            echo "XDG_BIN_HOME=$HOME/.local/bin"
            echo "XDG_CACHE_HOME=$HOME/.cache"
            echo "XDG_CONFIG_HOME=$HOME/.config"
            echo "XDG_DATA_HOME=$HOME/.local/share"
            echo "XDG_STATE_HOME=$HOME/.local/state"
            echo "XDG_RUNTIME_DIR=$HOME/.run"
            echo "JANET_TREE=$tree"
            echo "JANET_PATH=$tree/lib"
            echo "JANET_BINPATH=$HOME/.local/bin"
          } >>"$GITHUB_ENV"
          { echo "$tree/bin"; echo "$HOME/.local/bin"; } >>"$GITHUB_PATH"
          mkdir -p "$tree" "$HOME/.run" "$HOME/.local/bin" "$HOME/.cache" \
                   "$HOME/.config" "$HOME/.local/state" "$HOME/.local/share/hey"
          # modules/hey.nix generates this on a real system
          echo '{}' >"$HOME/.local/share/hey/info.json"

      - name: Build hey
        run: |
          nix shell --inputs-from . $TOOLCHAIN --command \
            bash -c 'jpm deps && jpm run deploy'

      - name: Run the test suites
        run: nix shell --inputs-from . $TOOLCHAIN --command hey test
